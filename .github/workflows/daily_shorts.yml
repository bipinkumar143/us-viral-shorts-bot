name: Daily YouTube Shorts generation and upload

on:
  # Runs once daily at 20:00 UTC. Change this cron to choose a different time.
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate the video but do not upload it
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: youtube-shorts-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required upload configuration
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_MADE_FOR_KIDS: ${{ vars.YT_MADE_FOR_KIDS }}
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Required repository secret $name is not configured." >&2
              exit 1
            fi
          done
          if [ "$YT_MADE_FOR_KIDS" != "true" ] && [ "$YT_MADE_FOR_KIDS" != "false" ]; then
            echo "Set repository variable YT_MADE_FOR_KIDS to true or false based on the actual audience of your content." >&2
            exit 1
          fi

      - name: Generate video only (manual dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python youtube_shorts_auto_bot.py --dry-run

      - name: Generate and upload Short
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_MADE_FOR_KIDS: ${{ vars.YT_MADE_FOR_KIDS }}
        run: python youtube_shorts_auto_bot.py

      - name: Save generated video and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-run-${{ github.run_number }}
          path: |
            output_shorts/*.mp4
            viral_diagnostics_log.json
          if-no-files-found: warn
          retention-days: 7
